name: Cloudflare

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify site
        run: npm run verify

      - name: Upload isolated pull-request preview
        if: github.event_name == 'pull_request'
        run: >-
          npx wrangler versions upload
          --preview-alias "pr-${{ github.event.pull_request.number }}"
          --tag "${{ github.event.pull_request.head.sha }}"
          --message "Pull request #${{ github.event.pull_request.number }}"

      - name: Validate pull-request preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: https://pr-${{ github.event.pull_request.number }}-crestendotpizza.crestenn.workers.dev
        run: |
          for attempt in 1 2 3 4 5; do
            npm run validate:deployment -- "$PREVIEW_URL" && exit 0
            sleep 5
          done
          exit 1

      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx wrangler deploy

      - name: Validate production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          WORKER_URL: https://crestendotpizza.crestenn.workers.dev
        run: |
          for attempt in 1 2 3 4 5; do
            npm run validate:deployment -- "$WORKER_URL" && exit 0
            sleep 5
          done
          exit 1
