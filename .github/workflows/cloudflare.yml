name: Cloudflare

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify site
        run: npm run verify

      - name: Prepare preview address
        id: preview
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            preview_alias="pr-$PR_NUMBER"
          else
            preview_alias="branch-$GITHUB_RUN_ID"
          fi
          echo "alias=$preview_alias" >> "$GITHUB_OUTPUT"
          echo "url=https://$preview_alias-crestendotpizza.crestenn.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Upload isolated non-production preview
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master')
        run: >-
          npx wrangler versions upload
          --preview-alias "${{ steps.preview.outputs.alias }}"
          --tag "${{ github.event.pull_request.head.sha || github.sha }}"
          --message "Preview for ${{ github.ref_name }}"

      - name: Validate non-production preview
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/master')
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            npm run validate:deployment -- "$PREVIEW_URL" && exit 0
            sleep 5
          done
          exit 1

      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx wrangler deploy

      - name: Validate production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          WORKER_URL: https://crestendotpizza.crestenn.workers.dev
        run: |
          for attempt in 1 2 3 4 5; do
            npm run validate:deployment -- "$WORKER_URL" && exit 0
            sleep 5
          done
          exit 1
